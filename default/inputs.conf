[script://$SPLUNK_HOME/etc/apps/TA-amdgpu/bin/amdgpu_events.py]
interval = 60
index = main
sourcetype = amdgpu:status
source = status
disabled = 0
python.version = python3
python.required = 3.9,3.13,3.14

[script://$SPLUNK_HOME/etc/apps/TA-amdgpu/bin/amdgpu_metrics.py]
interval = 60
index = metrics
